<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:,">
<title>Sample Document</title>
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="ui.css">
<style>
  .sheet-page { max-width: 640px; margin: 0 auto; padding: calc(var(--s7) + var(--safe-t)) var(--s5) var(--s7); display: flex; flex-direction: column; gap: var(--s5); }
  .paper { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r2); padding: var(--s7) var(--s6); display: flex; flex-direction: column; gap: var(--s4); min-height: 46vh; }
  .ruled i { display: block; height: 10px; border-radius: 5px; background: var(--sunken); }
  .ruled { display: flex; flex-direction: column; gap: 12px; margin-top: var(--s4); }
</style>
</head>
<body>
<main class="sheet-page">
  <button class="btn sm" id="back" style="align-self:flex-start">Back to the prototype</button>
  <div class="paper">
    <span class="eyebrow" id="kind">Sample document</span>
    <h1 class="display d-lg" id="title">Document</h1>
    <p class="soft">This is a placeholder for a real file. In the working product the contract, plan or proof itself opens here.</p>
    <div class="ruled"><i style="width:92%"></i><i style="width:84%"></i><i style="width:96%"></i><i style="width:70%"></i><i style="width:88%"></i><i style="width:46%"></i></div>
  </div>
  <p class="demo-flag">Demo data. Every person, supplier and price is invented.</p>
</main>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    document.getElementById('title').textContent = q.get('t') || 'Document';
    document.getElementById('kind').textContent = (q.get('k') || 'Sample document') + ' · sample';
    document.getElementById('back').addEventListener('click', function () { if (history.length > 1) history.back(); else window.close(); });
  })();
</script>
</body>
</html>
